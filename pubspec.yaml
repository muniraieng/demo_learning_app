name: demo_mobile_learning_app
description: Learning Dashboard demo app — Clean + MVVM, Dio, GetX, Riverpod Notifier, Drift.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3
  dio_smart_retry: ^6.0.0

  # State management
  get: ^4.6.6
  flutter_riverpod: ^2.5.1
  provider: ^6.1.2

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Connectivity / background
  connectivity_plus: ^6.0.3
  internet_connection_checker_plus: ^2.5.2
  workmanager: ^0.6.0

  # Security
  flutter_secure_storage: ^9.2.2

  # Utils
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/mock/courses.json
